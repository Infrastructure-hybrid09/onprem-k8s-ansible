# 1차 프로젝트 - Ansible Inventory
# Ansible SSH는 Management Network(192.168.14.0/24)만 사용


# ============================================================
# Load Balancers
# ============================================================

[loadbalancers]
lb1 ansible_host=192.168.14.11
lb2 ansible_host=192.168.14.12


# ============================================================
# DevOps
# ============================================================

[devops_nodes]
devops ansible_host=192.168.14.21 ansible_connection=local


# ============================================================
# Kubernetes Control Plane
# ============================================================

[control_plane]
cp1 ansible_host=192.168.14.31
cp2 ansible_host=192.168.14.32
cp3 ansible_host=192.168.14.33


# ============================================================
# Kubernetes Workers
# ============================================================

[workers]
worker1 ansible_host=192.168.14.41
worker2 ansible_host=192.168.14.42
worker3 ansible_host=192.168.14.43


# ============================================================
# Database
# ============================================================

[database]
db-primary ansible_host=192.168.14.51
db-replica ansible_host=192.168.14.52


# ============================================================
# NFS
# ============================================================

[nfs_nodes]
nfs ansible_host=192.168.14.61


# ============================================================
# Infrastructure - DNS / NTP
# ============================================================

[infra_nodes]
infra ansible_host=192.168.14.62


# ============================================================
# DR K3s
# ============================================================

[k3s_nodes]
dr-k3s ansible_host=192.168.14.71


# ============================================================
# MinIO
# ============================================================

[minio_nodes]
minio-s3 ansible_host=192.168.14.72


# ============================================================
# Central Monitoring VM
# Prometheus / Grafana / Loki
# ============================================================

[monitoring_nodes]
monitoring ansible_host=192.168.14.73


# ============================================================
# Node Exporter 대상 일반 VM
#
# NOTE:
# monitoring VM은 모니터링 담당자가 별도 Node Exporter
# (node-exporter.service / Podman)를 관리하므로 여기서 제외
# ============================================================

[monitoring_vm_nodes:children]
loadbalancers
devops_nodes
database
nfs_nodes
infra_nodes
minio_nodes


# ============================================================
# DevOps VM을 제외한 원격 관리 대상
# ============================================================

[managed_servers:children]
loadbalancers
control_plane
workers
database
nfs_nodes
infra_nodes
minio_nodes
k3s_nodes
monitoring_nodes


# ============================================================
# 프로젝트 전체 VM
# ============================================================

[project_nodes:children]
devops_nodes
managed_servers


# ============================================================
# 원격 서버 공통 Ansible 계정
# ============================================================

[managed_servers:vars]
ansible_user=ansible
