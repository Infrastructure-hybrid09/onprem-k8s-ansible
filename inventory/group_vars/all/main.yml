---
common_timezone: "Asia/Seoul"

common_packages:
  - vim
  - curl
  - wget
  - git
  - net-tools
  - bind-utils
  - bash-completion
  - rsync
  - tar
  - chrony
  - firewalld

infra_dns_server: "192.168.14.62"
infra_ntp_server: "192.168.14.62"

# Infra DNS/NTP 서버 구축 전에는 false
common_use_infra_dns: false
common_use_infra_ntp: false

# =========================================================
# GitHub
# =========================================================
github_owner: "o3orro"
github_app_repository: "neuroplan-app"
github_gitops_repository: "neuroplan-gitops"

# =========================================================
# Real Application Repository
# =========================================================
application_github_owner: "Infrastructure-hybrid09"
application_github_repository: "onprem-k8s-application-devopsVM"
application_git_branch: "main"

# 실제 애플리케이션이 저장소 안에 있는 위치
application_root_path: "neuroplan-login-mvp"

# Argo CD가 감시할 Kustomize 경로
application_kustomize_path: "neuroplan-login-mvp/k8s/onprem"


# =========================================================
# Internal Container Registry
# =========================================================

frontend_image_repository: "neuroplan/frontend"
backend_image_repository: "neuroplan/backend"

# =========================================================
# Docker Hub
# =========================================================


# =========================================================
# GitOps
# =========================================================
gitops_branch: "main"
gitops_manifest_path: "manifests"


# =========================================================
# Jenkins
# =========================================================

# Ansible이 Jenkins API에 접근할 때 사용하는 주소
jenkins_api_url: "http://127.0.0.1:8080"

# 사용자가 브라우저에서 Jenkins에 접근하는 주소
jenkins_public_url: "http://192.168.14.21:8080"

# Jenkins 관리자 계정 / API Token
# 실제 값은 Vault에 저장
jenkins_admin_user: "{{ vault_jenkins_admin_user }}"
jenkins_api_token: "{{ vault_jenkins_api_token }}"


# =========================================================
# Jenkins Credentials ID
# =========================================================
jenkins_gitops_credential_id: "gitops-ssh-credentials"
jenkins_app_repo_credential_id: "app-repo-write-credentials"

# =========================================================
# Jenkins Pipeline Job
# =========================================================
jenkins_job_name: "neuroplan-login-mvp-ci"
jenkins_git_branch: "main"
jenkins_pipeline_script_path: "Jenkinsfile"
jenkins_poll_scm: "H/2 * * * *"

# =========================================================
# Argo CD
# =========================================================
argocd_automated_sync: true

# =========================================================
# Harbor Jenkins Credential
# =========================================================
jenkins_harbor_credential_id: "harbor-registry"
harbor_jenkins_username: 'robot$jenkins'
