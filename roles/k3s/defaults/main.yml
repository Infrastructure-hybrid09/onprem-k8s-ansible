---
k3s_version: "v1.35.4+k3s1"

k3s_install_url: "https://get.k3s.io"
k3s_install_script_path: "/usr/local/src/install-k3s.sh"

k3s_node_name: "dr-k3s"

k3s_management_ip: ""
k3s_node_ip: ""
k3s_advertise_address: ""

k3s_flannel_iface: "ens192"

k3s_cluster_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"
k3s_service_node_port_range: "30000-32767"

k3s_cluster_domain: "neuroplan.local"

k3s_disable_components:
  - traefik
  - servicelb

# K3s monitoring
k3s_supervisor_metrics: true
