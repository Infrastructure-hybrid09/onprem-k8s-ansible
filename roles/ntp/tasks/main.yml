---
# ============================================================
# InfraReady - NTP Client
# Central NTP Server: Infra 192.168.14.62
# ============================================================

# ------------------------------------------------------------
# 1. Chrony package check
# ------------------------------------------------------------

- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: auto


# ------------------------------------------------------------
# 2. Install chrony
# ------------------------------------------------------------

- name: Install chrony when missing
  ansible.builtin.dnf:
    name: chrony
    state: present
  when: "'chrony' not in ansible_facts.packages"


# ------------------------------------------------------------
# 3. Deploy chrony client configuration
# ------------------------------------------------------------

- name: Deploy chrony client configuration
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: Restart chronyd


# ------------------------------------------------------------
# 4. Apply configuration changes
# ------------------------------------------------------------

- name: Apply chronyd restart before verification
  ansible.builtin.meta: flush_handlers


# ------------------------------------------------------------
# 5. Enable chronyd
# ------------------------------------------------------------

- name: Enable and start chronyd
  ansible.builtin.service:
    name: chronyd
    enabled: true
    state: started


# ------------------------------------------------------------
# 6. Verify chronyd service
# ------------------------------------------------------------

- name: Check chronyd service
  ansible.builtin.command:
    cmd: systemctl is-active chronyd
  register: chronyd_status
  changed_when: false
  check_mode: false
  failed_when: chronyd_status.stdout | trim != "active"


- name: Show chronyd status
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} chronyd is {{ chronyd_status.stdout }}"


# ============================================================
# NTP Synchronization Validation
# ============================================================

# ------------------------------------------------------------
# 7. Mark NTP source online
# ------------------------------------------------------------

- name: Mark NTP sources online
  ansible.builtin.command:
    cmd: chronyc online
  changed_when: false
  when: not ansible_check_mode


# ------------------------------------------------------------
# 8. Trigger NTP measurements
# ------------------------------------------------------------

- name: Burst NTP measurements
  ansible.builtin.command:
    cmd: chronyc burst 4/4
  changed_when: false
  when: not ansible_check_mode


# ------------------------------------------------------------
# 9. Wait for synchronization
# ------------------------------------------------------------

- name: Wait for NTP synchronization
  ansible.builtin.command:
    cmd: chronyc tracking
  register: ntp_tracking
  changed_when: false
  check_mode: false
  retries: 30
  delay: 2
  until: >
    ntp_tracking.stdout
    is search('(?m)^Leap status\\s*:\\s*Normal\\s*$')


# ------------------------------------------------------------
# 10. Check selected NTP source
# ------------------------------------------------------------

- name: Check selected NTP source
  ansible.builtin.command:
    cmd: chronyc -n sources
  register: ntp_sources
  changed_when: false
  check_mode: false


# ------------------------------------------------------------
# 11. Verify Infra NTP server is selected
# ------------------------------------------------------------

- name: Verify client uses Infra as selected NTP source
  ansible.builtin.assert:
    that:
      - ntp_sources.stdout is search('(?m)^\\^\\*\\s+' ~ (ntp_server_ip | regex_escape) ~ '\\s+')
    fail_msg: >-
      {{ inventory_hostname }} is not synchronized with
      Infra NTP server {{ ntp_server_ip }}
    success_msg: >-
      {{ inventory_hostname }} is synchronized with
      Infra NTP server {{ ntp_server_ip }}


# ------------------------------------------------------------
# 12. Final validation summary
# ------------------------------------------------------------

- name: Show NTP validation summary
  ansible.builtin.debug:
    msg:
      - "========================================"
      - " NTP CLIENT VALIDATION SUMMARY"
      - "========================================"
      - "Host          : {{ inventory_hostname }}"
      - "chronyd       : {{ chronyd_status.stdout | trim }}"
      - "Leap Status   : {{ 'Normal' if ntp_tracking.stdout is search('(?m)^Leap status\\s*:\\s*Normal\\s*$') else 'NOT SYNCED' }}"
      - "NTP Server    : {{ ntp_server_ip }}"
      - "Result        : PASSED"
      - "========================================"
