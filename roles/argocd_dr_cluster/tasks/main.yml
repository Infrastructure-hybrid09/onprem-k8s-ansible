---
- name: Validate DR cluster registration variables
  ansible.builtin.assert:
    that:
      - argocd_dr_cluster_secret_name | length > 0
      - argocd_dr_server | length > 0
      - argocd_dr_managed_namespace | length > 0
      - argocd_dr_token_secret_name | length > 0
    fail_msg: "Argo CD DR cluster variables are not configured correctly."

# --------------------------------------------------
# Safety check on Main K8s
# --------------------------------------------------

- name: Verify Main Argo CD application exists
  ansible.builtin.command:
    argv:
      - "{{ argocd_main_kubectl_bin }}"
      - -n
      - "{{ argocd_main_namespace }}"
      - get
      - application
      - "{{ argocd_main_application_name }}"
      - -o
      - jsonpath={.spec.destination.server}
  delegate_to: localhost
  become: false
  register: argocd_main_destination
  changed_when: false
  check_mode: false

- name: Protect Main Argo CD context
  ansible.builtin.assert:
    that:
      - argocd_main_destination.stdout == argocd_main_expected_destination
    fail_msg: >-
      Local kubectl does not point to the expected Main Argo CD environment.
      DR cluster registration was aborted.

# --------------------------------------------------
# Read credential directly on DR K3s
# --------------------------------------------------

- name: Verify DR token Secret exists
  ansible.builtin.command:
    argv:
      - "{{ argocd_dr_kubectl_bin }}"
      - -n
      - "{{ argocd_dr_service_account_namespace }}"
      - get
      - secret
      - "{{ argocd_dr_token_secret_name }}"
      - -o
      - name
  register: argocd_dr_secret_check
  changed_when: false
  check_mode: false

- name: Ensure DR token Secret is reachable
  ansible.builtin.assert:
    that:
      - argocd_dr_secret_check.stdout == "secret/{{ argocd_dr_token_secret_name }}"
    fail_msg: "DR Argo CD token Secret is not accessible."

- name: Read DR Argo CD token Secret
  ansible.builtin.command:
    argv:
      - "{{ argocd_dr_kubectl_bin }}"
      - -n
      - "{{ argocd_dr_service_account_namespace }}"
      - get
      - secret
      - "{{ argocd_dr_token_secret_name }}"
      - -o
      - json
  register: argocd_dr_secret_raw
  changed_when: false
  check_mode: false
  no_log: true

- name: Parse DR token Secret
  ansible.builtin.set_fact:
    argocd_dr_secret_data: "{{ argocd_dr_secret_raw.stdout | from_json }}"
  no_log: true

- name: Prepare DR cluster credentials
  ansible.builtin.set_fact:
    argocd_dr_bearer_token: >-
      {{ argocd_dr_secret_data.data.token | b64decode }}
    argocd_dr_ca_data: >-
      {{ argocd_dr_secret_data.data['ca.crt'] }}
  no_log: true

- name: Verify DR credential data exists
  ansible.builtin.assert:
    that:
      - argocd_dr_bearer_token | length > 0
      - argocd_dr_ca_data | length > 0
    fail_msg: "DR ServiceAccount token or CA data is missing."
  no_log: true

# --------------------------------------------------
# Register into Main Argo CD
# --------------------------------------------------

- name: Register DR K3s cluster in Main Argo CD
  ansible.builtin.command:
    cmd: "{{ argocd_main_kubectl_bin }} apply -f -"
    stdin: "{{ lookup('ansible.builtin.template', 'cluster-secret.yaml.j2') }}"
  delegate_to: localhost
  become: false
  register: argocd_dr_cluster_apply
  changed_when: >
    ' created' in argocd_dr_cluster_apply.stdout or
    ' configured' in argocd_dr_cluster_apply.stdout
  no_log: true

# --------------------------------------------------
# Verification without exposing credentials
# --------------------------------------------------

- name: Verify DR cluster Secret type
  ansible.builtin.command:
    argv:
      - "{{ argocd_main_kubectl_bin }}"
      - -n
      - "{{ argocd_main_namespace }}"
      - get
      - secret
      - "{{ argocd_dr_cluster_secret_name }}"
      - -o
      - jsonpath={.metadata.labels.argocd\.argoproj\.io/secret-type}
  delegate_to: localhost
  become: false
  register: argocd_dr_cluster_type
  changed_when: false
  check_mode: false
  when:
    - not ansible_check_mode

- name: Ensure DR cluster registration exists
  ansible.builtin.assert:
    that:
      - argocd_dr_cluster_type.stdout == "cluster"
    fail_msg: "DR K3s cluster Secret was not registered correctly."
  when:
    - not ansible_check_mode

- name: Show DR cluster registration plan
  ansible.builtin.debug:
    msg: "DR K3s cluster would be registered in Main Argo CD."
  when:
    - ansible_check_mode
  changed_when: true
